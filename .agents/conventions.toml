#:tombi toml-version = "v1.0.0"

# Per-consumer conventions manifest (agentic-dev core; see
# .agents/core/fragments/conventions.example.toml for the field guide). Read by
# the core skills, notably reference-project-convention-drift.

[project]
name = "aifix"
languages = ["rust", "nushell", "typescript"]

[core]
path = ".agents/core"

[reference]
# aifix conventions intentionally track the Wyrd workspace it supports.
name = "wyrd"
root = "../wyrd"

[surfaces]
docs = [
  "AGENTS.md",
  "ARCHITECTURE.md",
  "CONTRIBUTING.md",
  "docs/ADR.md",
  "docs/KNOWLEDGE.md",
]
configs = [
  "prek.toml",
  ".config/wt.toml",
  ".commitlintrc.mts",
  "mise.toml",
  "treefmt.toml",
  "typos.toml",
  "rumdl.toml",
  "tombi.toml",
]
settings = [".claude/settings.json"]

[gates]
check = [
  "cargo fmt --all",
  "cargo build --workspace --all-targets",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo nextest run --workspace",
  "mise run treefmt:check",
  "mise run docs:manifest-drift",
]

[tracker]
prefix = "aifix"
