#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.0.0"

[settings]
activate_aggressive = true
experimental = true
env_shell_expand = true
minimum_release_age = "1d"
lockfile = true

[settings.npm]
package_manager = "aube"

[settings.pipx]
uvx = true

[env]
# Cargo resolves external subcommand binaries from PATH. Prefer the active
# rustup toolchain so Homebrew/system Rust cannot shadow rust-toolchain.toml.
_.path = [
  "{{ exec(command='rustup=\"$(command -v rustup || echo \"$HOME/.cargo/bin/rustup\")\"; dirname \"$(\"$rustup\" which rustc)\"') }}",
]

[tasks."cargo:build"]
description = "Build the Rust workspace"
run = """
cargo build --workspace --all-targets --all-features
"""

[tasks."cargo:clippy"]
description = "Run Clippy over all workspace targets"
run = """
cargo clippy --workspace --all-targets --all-features -- -D warnings
"""

[tasks."cargo:fmt"]
description = "Format Rust sources"
run = """
cargo fmt --all
"""

[tasks."cargo:nextest"]
description = "Run Rust tests with nextest"
run = """
cargo nextest run --workspace --all-targets --all-features
"""

[tasks."cargo:llvm-cov"]
description = "Generate coverage (lcov + summary) into coverage/ (report-only, no gate)"
run = """
mkdir -p coverage
cargo llvm-cov --no-report --workspace --all-targets --all-features
cargo llvm-cov report --lcov --output-path coverage/lcov.info
cargo llvm-cov report --summary-only
"""

[tasks.treefmt]
description = "Format and lint supported project files"
run = """
treefmt
"""

[tasks."treefmt:check"]
description = "Check supported project files without rewriting them"
run = """
treefmt --ci
"""

[tasks."commitlint:last"]
description = "Validate the most recent commit message"
run = """
aube exec commitlint --last --config .commitlintrc.mts
"""

[tasks."commitlint:branch"]
description = "Validate commit messages from main to the current branch"
run = """
aube exec commitlint --from main --to HEAD --config .commitlintrc.mts
"""

[tasks."docs:manifest-drift"]
description = "Verify docs/MANIFEST.toml BLAKE3 hashes against documented files"
run = """
nu scripts/check-docs-manifest-drift.nu
"""

[tasks."docs:conflict-markers"]
description = "Detect unresolved Git conflict markers in tracked text files"
run = """
nu .agents/core/scripts/check-conflict-markers.nu
"""

[tasks."core:check"]
description = "Verify the vendored agentic-dev core submodule is initialized, clean, and at the recorded pin"
run = """
nu .agents/core/scripts/check-core-pin.nu
"""

[tasks."core:update"]
description = "Bump the vendored agentic-dev core to upstream main (commit the new pin deliberately)"
run = """
git submodule update --remote .agents/core
git status --short .agents/core
"""

[tasks."changelog:generate"]
description = "Generate CHANGELOG.md from conventional commits"
run = """
git-cliff --output CHANGELOG.md
"""

[tasks."changelog:check"]
description = "Check that generated changelog content is current"
run = """
tmp="$(mktemp)"
trap 'rm -f "$tmp"' EXIT
git-cliff --output "$tmp"
if [ -s "$tmp" ] && ! cmp --silent "$tmp" CHANGELOG.md; then
  echo "CHANGELOG.md is out of date; run 'mise run changelog:generate'" >&2
  exit 1
fi
if [ ! -s CHANGELOG.md ]; then
  echo "CHANGELOG.md is empty" >&2
  exit 1
fi
"""

[tools]
"cargo:b3sum" = "1.8.5"
"cargo:cargo-careful" = "0.4.10"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-nextest" = "0.9.140"
"cargo:git-cliff" = "2.13.1"
"cargo:nu" = "0.113.1"
"cargo:prek" = "0.4.8"
"cargo:rumdl" = "0.2.28"
"cargo:typos-cli" = "1.48.0"
"cargo:zizmor" = "1.26.1"
"cargo:worktrunk" = "0.65.0"
"github:agda/agda" = "2.8.0"
"github:endevco/aube" = "1.25.2"
"github:numtide/treefmt" = "2.5.0"
"github:tombi-toml/tombi" = "1.2.0"
node = "26.4.0"
