#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise.json
# The published mise schema omits several live `settings` keys; strict mode
# would reject them.
#:tombi schema.strict = false

min_version = "2026.7.5"

[settings]
activate_aggressive = true
experimental = true
env_shell_expand = true
minimum_release_age = "1d"
lockfile = true

[settings.npm]
package_manager = "aube"

[settings.pipx]
uvx = true

[settings.cargo]
binstall = true

[env]
# Matches the toolchain pin `rust-toolchain.toml` and the CI workflow set.
# `RUSTUP_TOOLCHAIN` overrides every `rust-toolchain` file in the tree.
RUSTUP_TOOLCHAIN = "{{ get_env(name='RUSTUP_TOOLCHAIN', default='nightly-2026-07-07') }}"
# Cargo resolves external subcommand binaries from PATH. Prefer the active
# rustup toolchain so Homebrew/system Rust cannot shadow the pinned
# toolchain.
_.path = ["{{ exec(command='command -v rustup >/dev/null 2>&1 || { echo \"rustup required: the pinned toolchains resolve through it\" >&2; exit 1; }; dirname \"$(command -v rustup)\"') }}"]

[task_config]
includes = [".config/mise/tasks"]

[tools]
"cargo:b3sum" = "1.8.5"
"cargo:cargo-binstall" = "1.20.1"
"cargo:cargo-careful" = "0.4.10"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-nextest" = "0.9.143"
"cargo:coreutils" = "0.9.0"
"cargo:git-cliff" = "2.13.1"
"cargo:nu" = "0.113.1"
"cargo:nu-lint" = "1.3.0"
"cargo:prek" = "0.5.0"
"cargo:rumdl" = "0.2.62"
"cargo:sizelint" = "0.1.5"
"cargo:typos-cli" = "1.49.0"
"cargo:wrkflw" = "0.8.0"
"cargo:zizmor" = "1.26.1"
"cargo:worktrunk" = "0.75.0"
"github:agda/agda" = "2.8.0"
"github:numtide/treefmt" = "2.5.0"
"github:tombi-toml/tombi" = "1.5.0"
act = "0.2.89"
aube = "1.26.0"
node = "26.4.0"
