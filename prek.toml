#:tombi toml-version = "v1.0.0"
#:schema https://www.schemastore.org/prek.json

fail_fast = false
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "local"

# Core-backed base hooks.
[[repos.hooks]]
id = "prek-validate-config"
name = "prek validate-config"
language = "system"
entry = "mise exec -- prek validate-config prek.toml"
files.glob = ["prek.toml", "mise.toml", "mise.lock"]
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "commitlint"
name = "commitlint"
entry = "mise x -- commitlint --edit"
language = "system"
stages = ["commit-msg"]
always_run = true
pass_filenames = true

[[repos.hooks]]
id = "treefmt-check"
name = "treefmt --ci"
language = "system"
entry = "mise exec -- treefmt --ci"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "cargo-fmt-check"
name = "cargo fmt --check"
language = "system"
entry = "mise exec -- cargo fmt --all -- --check"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "docs-manifest-drift"
name = "docs manifest drift"
language = "system"
entry = "mise run docs:manifest-drift"
files.glob = ["docs/**"]
pass_filenames = false
stages = ["pre-commit"]

# Aifix pre-push gates.
[[repos.hooks]]
id = "act-ci"
name = "full cached act CI simulation"
language = "system"
entry = "mise exec -- nu scripts/act-ci.nu --all --rm"
pass_filenames = false
always_run = true
stages = ["pre-push"]
