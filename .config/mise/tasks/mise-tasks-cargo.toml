#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

["cargo:build"]
description = "Build the Rust workspace"
run = """
cargo build --workspace --all-targets --all-features
"""

["cargo:clippy"]
description = "Run Clippy over all workspace targets"
run = """
cargo clippy --workspace --all-targets --all-features -- -D warnings
"""

["cargo:fmt"]
description = "Format Rust sources"
run = """
cargo fmt --all
"""

["cargo:nextest"]
description = "Run Rust tests with nextest"
run = """
cargo nextest run --workspace --all-targets --all-features
"""

["cargo:llvm-cov"]
description = "Generate coverage (lcov + summary) into coverage/ (report-only, no gate)"
run = """
mkdir -p coverage
cargo llvm-cov --no-report --workspace --all-targets --all-features
cargo llvm-cov report --lcov --output-path coverage/lcov.info
cargo llvm-cov report --summary-only
"""
