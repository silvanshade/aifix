#:tombi toml-version = "v1.0.0"

# Hook changes require `wt config approvals add`.
[[pre-start]]
mise-trust = "mise trust -y {{ worktree_path }}/mise.toml"

[[pre-start]]
wt-step-copy-gitignored = "wt step copy-ignored"

[[pre-start]]
beads-chmod = "chmod 0700 .beads"

[[pre-start]]
beads-pull = "bd dolt pull || true"

[pre-merge]
# Aifix uses one legacy ADR file, not an ADR directory.
act-ci = "mise exec -- nu scripts/act-ci.nu --all --rm"
beads = "bd dolt pull && bd dolt push"

[post-merge]
beads-pull = "bd dolt pull"

[step.copy-ignored]
exclude = [".beads/*.jsonl"]
