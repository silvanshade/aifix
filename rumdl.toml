#:tombi toml-version = "v1.0.0"
#:schema https://raw.githubusercontent.com/rvben/rumdl/refs/heads/main/rumdl.schema.json

[global]
flavor = "standard"
line-length = 0
respect-gitignore = true
exclude = [
  ".beads",
  ".git",
  "node_modules",
  "vendor",
  "dist",
  "build",
]

# MD001
[heading-increment]

# MD003
[heading-style]
style = "atx"

# MD004
[ul-style]
style = "sublist"

# MD005
[list-indent]

# MD007
[ul-indent]

# MD009
[no-trailing-spaces]
strict = true

# MD010
[no-hard-tabs]

# MD011
[no-reversed-links]

# MD012
[no-multiple-blanks]

# MD013
[line-length]
code-block-line-length = 0
heading-line-length = 0
line-length = 0
reflow = true
reflow-mode = "semantic-line-breaks"

# MD014
[commands-show-output]
show-output = true

# MD018
[no-missing-space-atx]
magiclink = false
# tags = true

# MD019
[no-multiple-space-atx]

# MD020
[no-missing-space-closed-atx]

# MD021
[no-multiple-space-closed-atx]

# MD022
[blanks-around-headings]

# MD023
[heading-start-left]

# MD024
[no-duplicate-heading]
siblings-only = false

# MD025
[single-title]

# MD026
[no-trailing-punctuation]

# MD027
[no-multiple-space-blockquote]

# MD028
[no-blanks-blockquote]

# MD029
[ol-prefix]

# MD030
[list-marker-space]

# MD031
[blanks-around-fences]

# MD032
[blanks-around-lists]

# MD033
[no-inline-html]

# MD034
[no-bare-urls]

# MD035
[hr-style]

# MD036
[no-emphasis-as-heading]

# MD037
[no-space-in-emphasis]

# MD038
[no-space-in-code]

# MD039
[no-space-in-links]

# MD040
[fenced-code-language]

# MD041
[first-line-heading]

# MD042
[no-empty-links]

# MD043
[required-headings]

# MD044
[proper-names]

# MD045
[no-alt-text]

# MD046
[code-block-style]
style = "fenced"

# MD047
[single-trailing-newline]

# MD048
[code-fence-style]
style = "backtick"

# MD049
[emphasis-style]
style = "underscore"

# MD050
[strong-style]
style = "asterisk"

# MD051
[link-fragments]

# MD052
[reference-links-images]
shortcut-syntax = true

# MD053
[link-image-reference-definitions]

# MD054
[link-image-style]

# MD055
[table-pipe-style]
style = "leading-and-trailing"

# MD056
[table-column-count]

# MD057
[existing-relative-links]
absolute-links = "warn"
compact-paths = true

# MD058
[blanks-around-tables]
minimum-before = 1
minimum-after = 1

# MD059
[descriptive-link-text]

# MD060
[table-format]
enabled = true
style = "aligned"
aligned-delimiter = true

# MD061
[forbidden-terms]

# MD062
[link-destination-whitespace]

# MD063
[heading-capitalization]

# MD064
[no-multiple-consecutive-spaces]

# MD065
[blanks-around-horizontal-rules]

# MD066
[footnote-validation]

# MD067
[footnote-definition-order]

# MD068
[empty-footnote-definition]

# MD069
[no-duplicate-list-markers]

# MD070
[nested-code-fence]
enabled = true

# MD071
[blank-line-after-frontmatter]

# MD072
[frontmatter-key-sort]

# MD073
[MD073]
enabled = true

# MD074
[mkdocs-nav]

# MD075
[orphaned-table-rows]

# MD076
[list-item-spacing]

# MD077
[list-continuation-indent]

# MD078
[missing-chunk-labels]

# MD079
[chunk-label-spaces]

# MD080
[heading-anchor-collision]
enabled = true

# MD081
[no-excessive-emphasis]
